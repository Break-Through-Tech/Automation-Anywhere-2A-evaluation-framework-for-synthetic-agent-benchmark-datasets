# Baseline agent configuration for the Difficulty metric.
# These settings are FIXED for every run and for both datasets.
# If you change anything below, bump baseline_version so old results are never
# mixed with new ones.

baseline_version: v1

# Path to your clone of https://github.com/sierra-research/tau2-bench
tau2_repo: ../tau2-bench

# How to invoke tau2. tau2-bench installs with `uv sync`, so `uv run tau2` works
# without activating a virtualenv. Use ["tau2"] if tau2 is already on your PATH.
tau2_cmd: ["uv", "run", "tau2"]

# Agent implementation. "llm_agent" is tau2's built-in agent. Swap this for a
# custom ReAct agent once one is registered with tau2.
agent: llm_agent

# Pin a dated model snapshot (not just "gpt-4.1") so results can't drift if the
# alias is repointed. Use the same model for agent and user simulator.
model: gpt-4.1-2025-04-14
user_model: gpt-4.1-2025-04-14

# Decoding settings (passed to the model as JSON)
decoding:
  temperature: 0.0
user_decoding:
  temperature: 0.0

seed: 42
max_steps: 30      # cap on agent/user steps per task
num_trials: 4      # trials per task (the "n" in 1 - c/n); set from the pilot run

domains: [retail, airline, telecom]
